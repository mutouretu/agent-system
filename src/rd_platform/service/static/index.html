<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>研发平台 · 研发管理控制台</title><link rel="stylesheet" href="/assets/app.css"></head>
<body>
<aside class="sidebar">
  <div class="brand">研发管理控制台</div>
  <nav>
    <a href="/" id="nav-projects">项目列表</a>
    <a href="/#development" id="nav-requirements">项目开发</a>
    <a href="/agents" id="nav-agents" class="fixed">Agent 管理</a>
  </nav>
</aside>
<main>
  <section id="overview">
    <h1>项目总览</h1>
    <div class="dashboard-search"><input id="project-search" type="search" placeholder="搜索项目"><select id="project-filter"><option value="active">活跃</option><option value="archived">归档</option><option value="deleted">回收站</option></select><span id="search-result-count"></span></div>
    <div class="delivery-stats"><span id="project-count"></span><span id="stat-projects"></span><span id="stat-running"></span><span id="delivery-percent"></span><span id="packages-summary"></span><span id="delivery-cycle"></span><span id="stat-failed"></span><span id="delivery-footer"></span></div>
    <p id="notice" class="hidden"></p>
    <button id="create-project">+ 新建项目</button>
    <p id="project-operation-result"></p>
    <p id="search-empty" class="hidden"></p>
    <p id="empty" class="hidden">还没有项目，先新建一个吧。</p>
    <span id="list-count"></span>
    <table><thead><tr><th>项目</th><th>里程碑</th><th>交付进度</th><th>状态</th><th>耗时</th><th>操作</th></tr></thead><tbody id="projects"></tbody></table>
  </section>
  <section id="requirement-studio" class="hidden"><h1>需求工作台</h1></section>
  <section id="project-detail" class="hidden">
    <header class="detail-header"><span id="breadcrumb-current"></span></header>
    <div class="workspace-toolbar"><label for="development-project">项目</label><select id="development-project"></select></div>
    <p id="development-empty" class="hidden">请选择或创建一个项目进入开发。</p>
    <div id="workspace-execution"></div>
    <div id="detail"></div>
  </section>
</main>
<dialog id="create-dialog">
  <form id="create-form">
    <h2>新建项目</h2>
    <label>项目名称<input id="project-name" required></label>
    <label>需求<textarea id="requirements"></textarea></label>
    <label>执行后端<select id="backend"><option value="codex">Codex</option><option value="llm">LLM API</option><option value="configured">项目 Agent 配置</option></select></label>
    <label>最大重试<input id="max-retries" type="number" value="3"></label>
    <p id="template-note"></p>
    <p id="form-error" class="error"></p>
    <button id="submit-run" type="submit">创建</button>
    <button type="button" id="create-close">取消</button>
  </form>
</dialog>
<dialog id="project-edit-dialog">
  <form id="project-edit-form">
    <h2>编辑项目</h2>
    <label>名称<input id="project-edit-name"></label>
    <label>目标<input id="project-edit-objective"></label>
    <label>里程碑<input id="project-edit-milestone"></label>
    <p id="project-edit-error" class="error"></p>
    <button type="submit" id="project-edit-save">保存</button>
    <button type="button" id="project-edit-cancel">取消</button>
    <button type="button" id="project-edit-close">关闭</button>
  </form>
</dialog>
<dialog id="project-delete-dialog">
  <form id="project-delete-form">
    <p id="project-delete-description"></p>
    <p id="project-delete-error" class="error"></p>
    <button type="submit" id="project-delete-confirm">删除</button>
    <button type="button" id="project-delete-cancel">取消</button>
    <button type="button" id="project-delete-close">关闭</button>
  </form>
</dialog>
<script src="/assets/app.js" defer></script><script src="/assets/studio.js" defer></script><script src="/assets/agent_config.js" defer></script>
</body></html>
